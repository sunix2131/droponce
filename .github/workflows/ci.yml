name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: test -z "$(gofmt -l $(find . -path ./frontend/node_modules -prune -o -name '*.go' -print))"
      - run: go vet $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go test $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go test -race $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck $(go list ./... | grep -v '/frontend/node_modules/')
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install matching Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - run: wails build -tags webkit2_41
